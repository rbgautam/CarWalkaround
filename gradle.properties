# JVM args for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is required for modern Jetpack (Compose, CameraX, lifecycle)
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Only generate the resources needed for the modules that use them
android.nonTransitiveRClass=true

# Enable parallel + caching for faster incremental builds
org.gradle.parallel=true
org.gradle.caching=true
